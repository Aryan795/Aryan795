<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" role="img" aria-label="GitHub statistics for Aryan795" font-family="'Segoe UI',Ubuntu,Helvetica,sans-serif">
<defs>
