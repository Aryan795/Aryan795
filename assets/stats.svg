<svg xmlns="http://www.w3.org/2000/svg" width="520" height="292" viewBox="0 0 520 292" role="img" aria-label="GitHub statistics for Aryan795">
<defs>
<clipPath id="fr"><rect x="0" y="0" width="520" height="292" rx="10"/></clipPath>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="#000" opacity=".55"/></pattern>
<linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#010409"/>
</linearGradient>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.prompt{font-size:12px;fill:#3fb950}.path{fill:#6e7681}.cmd{fill:#adbac7}
.label{fill:#6e7681;font-size:10px}
.value{fill:#e6edf3;font-size:21px;font-weight:700}
.sub{fill:#6e7681;font-size:8.5px}
.lang{fill:#adbac7;font-size:9.5px}
.fx{animation:in .5s ease backwards}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-origin:left center;animation:grow .9s cubic-bezier(.3,.8,.4,1) backwards}
.cur{fill:#3fb950;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.fx,.bar,.cur{animation:none}}
</style>
</defs>
<g clip-path="url(#fr)">
<rect width="520" height="292" fill="url(#bgg)"/>
