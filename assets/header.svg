  <text x="450.0" y="23" text-anchor="middle" font-size="12.5" fill="#6e7681">aryan@homelab: ~/profile</text>

  <g class="flick">
    <!-- prompt one -->
    <g clip-path="url(#type)">
      <text class="cmd" x="40" y="79">
        <tspan fill="#3fb950">aryan@homelab</tspan><tspan fill="#6e7681">:~$</tspan>
        <tspan class="arg"> whoami --verbose</tspan>
      </text>
    </g>

    <!-- glitched name -->
